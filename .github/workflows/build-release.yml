name: Build and test release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ready-to-run batch
        shell: powershell
        run: .\build\Build-Release.ps1

      - name: Verify generated batch is committed
        shell: powershell
        run: |
          git diff --exit-code -- TombRaider-Camera-Fix.bat
          if ($LASTEXITCODE -ne 0) {
            throw "TombRaider-Camera-Fix.bat is out of date. Run .\build\Build-Release.ps1 and commit the result."
          }

      - name: Run disposable-fixture tests
        shell: powershell
        run: .\build\Test-Release.ps1

      - name: Upload ready-to-run batch
        uses: actions/upload-artifact@v7
        with:
          name: TombRaider-Camera-Fix
          path: TombRaider-Camera-Fix.bat
          if-no-files-found: error

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download ready-to-run batch
        uses: actions/download-artifact@v8
        with:
          name: TombRaider-Camera-Fix

      - name: Attach batch to tagged GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $null = gh release view $tag --repo $repository 2>&1
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorActionPreference
          if ($releaseExists) {
            gh release upload $tag .\TombRaider-Camera-Fix.bat --clobber --repo $repository
          }
          else {
            gh release create $tag .\TombRaider-Camera-Fix.bat --verify-tag --generate-notes --title $tag --repo $repository
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to attach TombRaider-Camera-Fix.bat to release $tag."
          }
