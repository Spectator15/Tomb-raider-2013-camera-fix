name: Build and test release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ready-to-run batch
        shell: powershell
        run: .\build\Build-Release.ps1

      - name: Verify generated batch is committed
        shell: powershell
        run: |
          git diff --exit-code -- TombRaider-Camera-Fix.bat
          if ($LASTEXITCODE -ne 0) {
            throw "TombRaider-Camera-Fix.bat is out of date. Run .\build\Build-Release.ps1 and commit the result."
          }

      - name: Run disposable-fixture tests
        shell: powershell
        run: .\build\Test-Release.ps1

      - name: Upload ready-to-run batch
        uses: actions/upload-artifact@v7
        with:
          name: TombRaider-Camera-Fix
          path: TombRaider-Camera-Fix.bat
          if-no-files-found: error

  linux-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Build ready-to-run Linux release
        run: ./build/Build-LinuxRelease.sh

      - name: Verify generated Linux release is committed
        run: |
          if ! git diff --exit-code -- TombRaider-Camera-Fix-Linux.sh; then
            printf '%s\n' 'TombRaider-Camera-Fix-Linux.sh is out of date. Run ./build/Build-LinuxRelease.sh and commit the result.' >&2
            exit 1
          fi

      - name: Run Linux synthetic-fixture tests
        run: ./build/Test-LinuxRelease.sh

      - name: Upload ready-to-run Linux script
        uses: actions/upload-artifact@v7
        with:
          name: TombRaider-Camera-Fix-Linux
          path: TombRaider-Camera-Fix-Linux.sh
          if-no-files-found: error

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-build-and-test
      - linux-build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download ready-to-run batch
        uses: actions/download-artifact@v8
        with:
          name: TombRaider-Camera-Fix
          path: release

      - name: Download ready-to-run Linux script
        uses: actions/download-artifact@v8
        with:
          name: TombRaider-Camera-Fix-Linux
          path: release

      - name: Attach release files to tagged GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $null = gh release view $tag --repo $repository 2>&1
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorActionPreference
          if ($releaseExists) {
            gh release upload $tag .\release\TombRaider-Camera-Fix.bat .\release\TombRaider-Camera-Fix-Linux.sh --clobber --repo $repository
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '.\release\TombRaider-Camera-Fix.bat',
              '.\release\TombRaider-Camera-Fix-Linux.sh',
              '--verify-tag', '--generate-notes', '--title', $tag, '--repo', $repository
            )
            if ($tag.Contains('-')) {
              $arguments += '--prerelease'
            }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to attach the Windows and Linux files to release $tag."
          }
